name: iOS Unsigned Build

# Builds an unsigned .ipa (sign it with Sideloadly / AltStore before installing).
# - push to main      -> "dev-test" pre-release
# - published release -> attached to that release
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The 340 MB database lives in Git LFS; cache it so each run doesn't spend LFS bandwidth.
      - name: LFS object id
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-ids
      - name: Restore LFS cache
        uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          key: lfs-${{ hashFiles('.lfs-ids') }}
      - name: Pull LFS files
        run: git lfs pull

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build poetry data
        run: npm run build:data

      - name: Search smoke test
        run: npm test

      - name: Sync Capacitor iOS platform
        run: npx cap sync ios

      - name: Build app (unsigned)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry Doost.ipa Payload
          ls -la Doost.ipa

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: Doost.ipa

      - name: Publish dev-test pre-release
        if: github.event_name != 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-test
          name: "iOS Dev Test Build (${{ github.sha }})"
          body: |
            Automatically built unsigned IPA from commit ${{ github.sha }}.
            This is **not signed** — sign it with Sideloadly (or a similar tool) before installing on a device.
          prerelease: true
          files: Doost.ipa
