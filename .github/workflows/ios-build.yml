name: iOS Unsigned Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor iOS platform
        run: npx cap sync ios

      - name: Archive unsigned .app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            archive

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" Payload/
          zip -r Doost.ipa Payload

      - name: Publish dev-test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-test
          name: "iOS Dev Test Build (${{ github.sha }})"
          body: |
            Automatically built unsigned IPA from commit ${{ github.sha }} on `main`.
            This is **not signed** — sign it with Sideloadly (or a similar tool) before installing on a device.
          prerelease: true
          files: Doost.ipa
